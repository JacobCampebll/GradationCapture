# netlify.toml — pure static deploy. There is no API key in this app and no
# Netlify Function, because nothing leaves the phone.
#
# Folder layout for a drag-and-drop deploy:
#
#   GradationCapture/
#   ├── index.html
#   ├── netlify.toml       <- this file
#   ├── manifest.json
#   ├── sw.js
#   ├── icon-192.png
#   └── icon-512.png
#
# Drag the WHOLE GradationCapture folder onto the Netlify deploy area.

[build]
  publish = "."

# publish = "." serves the whole repo, which would put the worksheet photos in
# test/fixtures on a public URL. They are real company documents and have no
# business being downloadable, so the non-app paths are forced to 404.
# force = true matters: without it Netlify serves the static file first and the
# rule never fires.
[[redirects]]
  from = "/test/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

# The service worker must never be served stale, or phones keep running the old
# app forever. Everything else can cache hard.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
